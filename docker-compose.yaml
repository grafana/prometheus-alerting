networks:
  monitoring:
    driver: bridge

services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      - prometheus
      - alertmanager
      - mimir
      - loki
    networks:
      - monitoring

  prometheus:
    image: quay.io/prometheus/prometheus:v3.0.0@sha256:3b9b2a15d376334da8c286d995777d3b9315aa666d2311170ada6059a517b74f
    container_name: prometheus-test
    ports:
      - '9090:9090'
    volumes:
      - ./test-data/prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
    container_name: alertmanager-test
    ports:
      - '9093:9093'
    volumes:
      - ./test-data/alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address='
    networks:
      - monitoring

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio-test
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: mimir
      MINIO_ROOT_PASSWORD: mimirmimir
    command: server /data --console-address ":9001"
    volumes:
      - type: tmpfs
        target: /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - monitoring

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 mimir mimirmimir;
      mc mb myminio/mimir-ruler --ignore-existing;
      mc mb myminio/mimir-blocks --ignore-existing;
      mc mb myminio/mimir-alertmanager --ignore-existing;
      mc mb myminio/loki-chunks --ignore-existing;
      mc mb myminio/loki-ruler --ignore-existing;
      exit 0;
      "
    networks:
      - monitoring

  mimir:
    image: grafana/mimir:3.2.0@sha256:736f7459913d262444e70813565e3ca24b64dce24343da20af554ae6ee5268e8
    container_name: mimir-test
    ports:
      - '9009:9009'
    volumes:
      - ./test-data/mimir:/etc/mimir:ro
      - type: tmpfs
        target: /data
    command:
      - '-config.file=/etc/mimir/mimir.yaml'
      - '-target=all,alertmanager'
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - monitoring

  mimir-rules-provisioner:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    container_name: mimir-rules-provisioner
    depends_on:
      - mimir
    volumes:
      - ./test-data/mimir/rules:/rules:ro
      - ./test-data/mimir/provision-rules.mjs:/provision-rules.mjs:ro
    networks:
      - monitoring
    restart: on-failure
    command: ['node', '/provision-rules.mjs']

  mimir-alertmanager-provisioner:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    container_name: mimir-alertmanager-provisioner
    depends_on:
      - mimir
    volumes:
      - ./test-data/mimir/alertmanager:/alertmanager:ro
      - ./test-data/mimir/provision-alertmanager.mjs:/provision-alertmanager.mjs:ro
    networks:
      - monitoring
    restart: on-failure
    command: ['node', '/provision-alertmanager.mjs']

  loki:
    image: grafana/loki:3.2.0
    container_name: loki-test
    ports:
      - '3100:3100'
    volumes:
      - ./test-data/loki:/etc/loki:ro
    command:
      - '-config.file=/etc/loki/loki.yaml'
      - '-target=all,ruler'
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - monitoring

  loki-rules-provisioner:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    container_name: loki-rules-provisioner
    depends_on:
      - loki
    volumes:
      - ./test-data/loki/rules:/rules:ro
      - ./test-data/loki/provision-rules.mjs:/provision-rules.mjs:ro
    networks:
      - monitoring
    restart: on-failure
    command: ['node', '/provision-rules.mjs']
