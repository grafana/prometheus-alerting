# The backing services live in .config/compose/, one file per system. Paths inside those files are
# relative to .config/compose/, not to this file.
include:
  - .config/compose/prometheus.yaml
  - .config/compose/alertmanager.yaml
  - .config/compose/minio.yaml
  - .config/compose/mimir.yaml
  - .config/compose/loki.yaml

services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    build:
      args:
        # The create-plugin default is older than the minimum Grafana version in src/plugin.json.
        grafana_version: ${GRAFANA_VERSION:-13.1.0}
    environment:
      GF_USERS_DEFAULT_PERMISSIONS: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: false
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: promRulerApiViaProxyWrite
      GF_FEATURE_TOGGLES_splashScreen: 'false'
    depends_on:
      - prometheus
      - alertmanager
      - mimir
      - loki

  # MinIO stopped publishing images (minio/minio and minio/mc are gone from Docker Hub), so we swap
  # in Silo, pgsty's community fork of the same source. It keeps the MinIO command line, MINIO_* env
  # vars and the bundled mc, so only the image changes here; everything else about these services
  # still comes from .config/compose/minio.yaml. See https://silo.pgsty.com/compatibility/migration/
  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z@sha256:6ecdaec70bc5e8cf9d0e9a70c190f3beb1c83f11617ff4333f1fcd71ab1daf18
