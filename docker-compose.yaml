# The backing services live in .config/compose/, one file per system. Paths inside those files are
# relative to .config/compose/, not to this file.
include:
  - .config/compose/prometheus.yaml
  - .config/compose/alertmanager.yaml
  - .config/compose/minio.yaml
  - .config/compose/mimir.yaml
  - .config/compose/loki.yaml

services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    build:
      args:
        # The create-plugin default is older than the minimum Grafana version in src/plugin.json.
        grafana_version: ${GRAFANA_VERSION:-13.1.0}
    environment:
      GF_USERS_DEFAULT_PERMISSIONS: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: false
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: promRulerApiViaProxyWrite
      GF_FEATURE_TOGGLES_splashScreen: 'false'
    depends_on:
      - prometheus
      - alertmanager
      - mimir
      - loki
