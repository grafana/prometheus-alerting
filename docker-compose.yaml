# The backing services live in .config/compose/, one file per system. Paths inside those files are
# relative to .config/compose/, not to this file.
include:
  - .config/compose/prometheus.yaml
  - .config/compose/alertmanager.yaml
  - .config/compose/minio.yaml
  - .config/compose/mimir.yaml
  - .config/compose/loki.yaml

services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    build:
      args:
        # The create-plugin default is older than the minimum Grafana version in src/plugin.json.
        grafana_version: ${GRAFANA_VERSION:-13.1.0}
    environment:
      GF_USERS_DEFAULT_PERMISSIONS: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: false
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: promRulerApiViaProxyWrite
      GF_FEATURE_TOGGLES_splashScreen: 'false'
    depends_on:
      - prometheus
      - alertmanager
      - mimir
      - loki

  # MinIO stopped publishing images (minio/minio and minio/mc are gone from Docker Hub), so we swap
  # in pgsty, a community build of the same source with the same layout. Only the image changes here;
  # everything else about these services still comes from .config/compose/minio.yaml.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
