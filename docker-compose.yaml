services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      - prometheus
      - alertmanager
      - mimir

  prometheus:
    image: quay.io/prometheus/prometheus:v3.0.0
    container_name: prometheus-test
    ports:
      - "9090:9090"
    volumes:
      - ./test-data/prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager-test
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  mimir:
    image: grafana/mimir:latest
    container_name: mimir-test
    ports:
      - "9009:9009"
    volumes:
      - ./test-data/mimir:/etc/mimir
      - ./test-data/mimir/rules:/data/rules
      - mimir-data:/data
    command:
      - '-config.file=/etc/mimir/mimir.yaml'
      - '-target=all'

volumes:
  mimir-data:
