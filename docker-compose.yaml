networks:
  monitoring:
    driver: bridge

services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      - prometheus
      - alertmanager
      - mimir
    networks:
      - monitoring

  prometheus:
    image: quay.io/prometheus/prometheus:v3.0.0
    container_name: prometheus-test
    ports:
      - '9090:9090'
    volumes:
      - ./test-data/prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: alertmanager-test
    ports:
      - '9093:9093'
    volumes:
      - ./test-data/alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address='
    networks:
      - monitoring

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-test
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: mimir
      MINIO_ROOT_PASSWORD: mimirmimir
    command: server /data --console-address ":9001"
    volumes:
      - type: tmpfs
        target: /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - monitoring

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 mimir mimirmimir;
      mc mb myminio/mimir-ruler --ignore-existing;
      mc mb myminio/mimir-blocks --ignore-existing;
      mc mb myminio/mimir-alertmanager --ignore-existing;
      exit 0;
      "
    networks:
      - monitoring

  mimir:
    image: grafana/mimir:3.0.6
    container_name: mimir-test
    ports:
      - '9009:9009'
    volumes:
      - ./test-data/mimir:/etc/mimir:ro
      - type: tmpfs
        target: /data
    command:
      - '-config.file=/etc/mimir/mimir.yaml'
      - '-target=all,alertmanager'
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - monitoring

  mimir-rules-provisioner:
    image: curlimages/curl:8.20.0
    container_name: mimir-rules-provisioner
    depends_on:
      - mimir
    volumes:
      - ./test-data/mimir/rules:/rules:ro
      - ./test-data/mimir/provision-rules.sh:/provision-rules.sh:ro
    networks:
      - monitoring
    restart: on-failure
    command: ['/provision-rules.sh']
