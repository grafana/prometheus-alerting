name: 'Setup Node.js with caching'
description: 'Sets up Node.js with pnpm and pnpm store caching via setup-node built-in functionality'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
runs:
  using: 'composite'
  steps:
    # Install pnpm (version read from engines.pnpm in package.json)
    - name: Setup pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

    # Setup Node.js with built-in pnpm store cache (~/.local/share/pnpm/store)
    # Caches the pnpm store automatically using pnpm-lock.yaml as the cache key
    - name: Setup Node.js with pnpm cache
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm ci
