name: 'Setup Node.js with caching'
description: 'Sets up Node.js with npm tarball caching via setup-node built-in functionality'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
runs:
  using: 'composite'
  steps:
    # Setup Node.js with built-in npm cache (~/.npm)
    # This caches npm tarballs and metadata automatically
    - name: Setup Node.js with npm cache
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm ci
