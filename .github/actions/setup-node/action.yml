name: 'Setup Node.js'
description: 'Sets up Node.js and pnpm via mise, using versions from mise.lock'
runs:
  using: 'composite'
  steps:
    - name: Setup mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        install: true   # runs `mise install` using committed mise.lock
        cache: false    # disabled — cached binaries skip checksum re-verification; paranoid mode + mise.lock already verify every download

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
