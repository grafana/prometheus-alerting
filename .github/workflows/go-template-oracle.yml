name: Go template oracle

# The expected answers in packages/gotemplate/testdata/expected.json say how
# Go's own template parser reacts to each entry in the corpus. They are
# committed so that `pnpm test` needs no Go toolchain, which means nothing
# stops them going stale. This job regenerates them and fails if the result
# differs.
#
# It also runs weekly, so a change to text/template in a new Go release turns
# main red rather than surfacing months later as a mismatch nobody expected.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/gotemplate/**'
      - '.github/workflows/go-template-oracle.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/gotemplate/**'
  schedule:
    # Mondays, 07:00 UTC.
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Expected answers still match Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # Pinned to a minor line on purpose. Being *newer* than the Go that
          # built the Mimir we validate against is the risk here: a parser that
          # rejects something Mimir accepts blocks somebody from saving a
          # template that works. Bump this deliberately and re-diff the corpus.
          go-version: '1.24'
          cache-dependency-path: packages/gotemplate/oracle/go.mod

      # Straight to `go run` rather than through the pnpm script, so this job
      # needs no node or pnpm setup at all.
      - name: Regenerate the expected answers
        working-directory: packages/gotemplate/oracle
        run: go run .

      - name: Fail if they changed
        run: |
          if [[ -n "$(git status --porcelain packages/gotemplate/testdata)" ]]; then
            echo "::error::expected.json no longer matches Go. Run 'pnpm --filter @grafana/go-template oracle:refresh' and commit the result."
            git --no-pager diff -- packages/gotemplate/testdata
            exit 1
          fi
