name: Bundle size

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  compare:
    name: Compare against base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # Pin mise itself. Without this the action asks mise.jdx.dev/VERSION for
          # "latest", which has pointed at releases that were not on GitHub yet and
          # 404'd the download. Pinning also means the binary that installs our
          # verified tools is itself a known one, checked against sha256 below.
          # Bump both together — the hash is of the extracted linux-x64 binary.
          version: 2026.9.1
          sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea
          install: true
          install_args: node pnpm # lefthook is only for local Git hooks, so CI skips it
          cache: false
          cache_save: false

      - uses: grafana/plugin-actions/bundle-size@main # zizmor: ignore[unpinned-uses] provided by grafana
        with:
          node-version: "24.21"
