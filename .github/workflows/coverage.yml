name: Code Coverage

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: Run tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - branch: ${{ github.head_ref }}
            artifact: pull-request
            label: PR
          - branch: ${{ github.base_ref }}
            artifact: main
            label: Base

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Setup Node.js with caching
        uses: ./.github/actions/setup-node-with-cache

      - name: Run coverage
        run: npx vitest run --coverage --passWithNoTests

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.artifact }}
          path: coverage
          retention-days: 1

  report-coverage:
    name: Report coverage
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download PR coverage
        uses: actions/download-artifact@v6
        with:
          name: coverage-pull-request
          path: coverage

      - name: Download base coverage
        uses: actions/download-artifact@v6
        with:
          name: coverage-main
          path: coverage-main

      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@2500dafcee7dd64f85ab689c0b83798a8359770e # v2.9.3
        with:
          json-summary-compare-path: coverage-main/coverage-summary.json
          file-coverage-mode: none
          threshold-icons: "{0: '🔴', 80: '🟠', 90: '🟢'}"
