name: Rev-dep

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  rev-dep:
    name: Check dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js with caching
        uses: ./.github/actions/setup-node-with-cache

      - name: Run rev-dep
        id: rev-dep
        run: npm run rev-dep

      - name: Post failure comment
        if: failure() && steps.rev-dep.outcome == 'failure'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: rev-dep
          message: |
            ### rev-dep found issues

            See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

      - name: Delete stale comment
        if: always() && steps.rev-dep.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: rev-dep
          delete: true
