# Opens (or updates) a release PR with the next version bump and CHANGELOG entries
# based on conventional commits since the last tag.
#
# Merging the release PR creates a v* tag. Publishing to the plugin catalog stays
# a separate, manual step via publish.yml (workflow_dispatch against the new tag)
# — cd.yml's softprops/action-gh-release step then attaches signed artifacts to
# the GitHub Release that release-please already created.
#
# IMPORTANT: This workflow requires the `grafana-plugins-platform-bot` GitHub App
# to have permissions on your repository and GATB (GitHub App Token Broker) setup in deployment_tools.
# Before using it, request permissions by following the instructions here:
#   https://enghub.grafana-ops.net/docs/default/component/grafana-plugins-platform/plugins-ci-github-actions/035-github-app-permissions
# Skipping this step will cause this workflow to fail.
#
# Required repo files:
#   .release-please-manifest.json  — e.g. { ".": "1.1.0" }
#   release-please-config.json     — see release-please-config.json in this repo
#
# - include-component-in-tag: false — ensures tags are v1.2.3, not prometheus-alerting-v1.2.3
#
# Note: do NOT use skip-github-release — it prevents tag creation and breaks
# release-please state tracking. build-plugin (via softprops/action-gh-release)
# safely updates the release that release-please already created.
#
# WARNING: since this is being added to an existing repository, the first run
# will pull in every commit since the last tag (v1.1.0) to determine the bump
# and changelog. Review/edit that first release PR before merging.
#
# For more information, see
# https://github.com/grafana/plugin-ci-workflows/tree/main/actions/plugins/release-please

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Run release-please
        uses: grafana/plugin-ci-workflows/actions/plugins/release-please@plugins-release-please/v2.0.1 # zizmor: ignore[unpinned-uses] provided by grafana
