# Shared workflow for building, testing and packaging the plugin.
# Documentation: https://enghub.grafana-ops.net/docs/default/component/grafana-plugins-platform/plugins-ci-github-actions/010-plugins-ci-github-actions
# All inputs are documented in the workflow file itself:
# https://github.com/grafana/plugin-ci-workflows/blob/main/.github/workflows/ci.yml

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  build:
    name: Build & test
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@ci-cd-workflows/v10.1.0
    permissions:
      contents: read
      id-token: write
    with:
      # Append the PR commit SHA so each PR build gets a unique, identifiable version
      plugin-version-suffix: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
