# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.
  workflow_dispatch: # Allow manual triggering from GitHub Actions UI

permissions: read-all

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      attestations: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: false
          cache_save: false
        env:
          MISE_ENV: ci # Skip loading mise.local.toml (dev-only tools)

      - uses: grafana/plugin-actions/build-plugin@62c2d322b176c9b104fae6b300029e08d0a0ee8e # build-plugin/v1.0.2
        with:
          node-version: "24.16"
          policy_token: ${{ secrets.PLUGIN_SIGN_TOKEN }}
          attestation: true
