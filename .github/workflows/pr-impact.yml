# Rates how much impact a PR has, labels it `impact:*`, explains the rating in a
# comment, and leaves inline review comments on the files a reviewer should read
# first.
#
# The parts worth reading are not in this file:
#
#   .github/prompts/pr-impact.md      what Claude is asked, as prose
#   .mise/tasks/pr-impact/floor.mjs   the deterministic rules that run first
#   .mise/tasks/pr-impact/parse.mjs   turning Claude's answer into a rating
#   .mise/tasks/pr-impact/post.mjs    the labelling and commenting
#
# Those are mise file tasks, so `mise run pr-impact <number>` rates a real PR
# locally and prints what it would post, which is how to iterate on the prompt.
# The steps below invoke the scripts by path rather than through `mise run`.
# They import nothing but Node builtins, so the runner's own Node is enough and
# there is no toolchain step to install, cache, or have go down on us.
#
# Today this only labels and comments — it gates nothing. The intent is that a
# later change lets the bot approve PRs at the safe end of the scale, so authors
# don't wait on a reviewer for a typo fix. Rating on four tiers rather than a
# yes/no keeps that decision adjustable: start by auto-approving only
# `impact:trivial`, and move the line if the ratings hold up.
#
# Two things have to be sorted out before any of that:
#
#   1. The "main" ruleset on this repo has require_code_owner_review on, and we
#      have a CODEOWNERS file. A GitHub App approval satisfies a plain approval
#      count but can never satisfy CODEOWNERS, so that flag has to come off first
#      (it lives in deployment_tools/terraform/repositories/prometheus-alerting).
#   2. The approving step must NOT live in a PR-triggered workflow. On a
#      pull_request event GitHub runs the workflow file from the PR's own branch,
#      and the token broker binds the workflow path and event rather than the
#      file contents, so anyone with push access could edit this file and mint
#      their own approval. The approval belongs in a scheduled sweep that always
#      runs the copy on main.
#
# Design borrowed from grafana/plugin-actions' renovate-approve.yml and the
# write-up at grafana/grafana-catalog-team/docs/renovate-automerge. The Anthropic
# key comes from Vault the way loki and gcx do it — see the note on that step.
#
# Claude never holds a token that can write. It reads the diff, which is
# untrusted input, and hands back a rating plus a list of file/line/reason
# triples; the post job checks those against the real diff and posts them.

name: PR impact

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: pr-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLAUDE_MODEL: claude-sonnet-5
  CLAUDE_EFFORT: medium

jobs:
  judge:
    name: Rate impact
    # Drafts aren't asking for review yet. Fork PRs get a read-only token so we
    # couldn't label them anyway, and Renovate has its own gate.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Without this the default is six hours.
    timeout-minutes: 15
    # Read-only on purpose. id-token is what authenticates the job to Vault.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      floor: ${{ steps.floor.outputs.floor }}
      reason: ${{ steps.floor.outputs.reason }}
      tier: ${{ steps.parse.outputs.tier }}
      body: ${{ steps.parse.outputs.body }}
      spots: ${{ steps.parse.outputs.spots }}
      ready: ${{ steps.gate.outputs.ready }}
      model: ${{ steps.parse.outputs.model }}
      took: ${{ steps.parse.outputs.took }}
      truncated: ${{ steps.prompt.outputs.truncated }}
    steps:
      # The base branch, not the PR head: Claude reads the repository's own code
      # to judge what the change touches, and gets the diff through `gh pr diff`.
      # It also means the prompt and the scripts come from main, so a PR cannot
      # rewrite the rules it is about to be judged by.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Check the tasks exist on the base branch
        id: gate
        run: |
          if [ -f .mise/tasks/pr-impact/floor.mjs ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo "The impact tasks are not on $BASE_REF yet, so there is nothing to run."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Work out the floor
        id: floor
        if: steps.gate.outputs.ready == 'true'
        run: node .mise/tasks/pr-impact/floor.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # The prompt is prose in its own file; only the two facts that change per
      # run are added here. claude-code-action passes `prompt` through verbatim,
      # so without this Claude has no idea which PR it is looking at, and the
      # base-branch checkout means `gh pr view` cannot work it out either.
      - name: Build the prompt
        id: prompt
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The diff goes in here rather than being fetched by Claude. Left to
          # find the PR itself, it spends turns re-running `gh pr diff` through
          # sed and grep hunting for line numbers — one run did that thirteen
          # times. Handing it over costs the same tokens and removes the hunt.
          #
          # Big diffs get cut. Two of the last sixty PRs would be trimmed, and
          # both touch paths the floor already holds at high, so nothing is lost
          # that would change a rating.
          #
          # Static text first, variable text last: the prompt file is the same
          # on every run and can be cached, which it cannot be if the PR number
          # sits in front of it.
          #
          # Random delimiter, matching what the tasks do when they write step
          # outputs — this one carries a diff, which anyone opening a PR writes.
          delimiter="EOF_$(openssl rand -hex 16)"
          truncated=false
          diff="$RUNNER_TEMP/pr.diff"
          gh pr diff "$PR_NUMBER" > "$diff"
          {
            echo "text<<$delimiter"
            cat .github/prompts/pr-impact.md
            echo
            echo "Repository: $GH_REPO"
            echo "PR number: $PR_NUMBER"
            echo
            echo "The diff follows."
            if [ "$(wc -c < "$diff")" -gt 120000 ]; then
              echo "It was too long to include whole, so it stops part way through."
              truncated=true
            fi
            echo
            head -c 120000 "$diff"
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          # The post job holds a PR rated on half a diff to medium at best.
          echo "truncated=$truncated" >> "$GITHUB_OUTPUT"

      # Vault rather than workload identity federation, because this runs on a
      # pull_request event. A WIF exchange proves who is asking with the OIDC
      # token GitHub issues the job, and for a pull_request that token says
      # `pull_request`, never a branch. The org's federation rule pins main — it
      # is what lets the renovate gate mint an approving token safely — so a
      # PR-triggered run cannot satisfy it. Every Claude workflow in the org
      # splits the same way: schedule and workflow_dispatch use WIF, and the
      # pull_request ones (loki, gcx) use Vault.
      - name: Get the Anthropic key
        id: secrets
        if: steps.gate.outputs.ready == 'true'
        uses: grafana/shared-workflows/actions/get-vault-secrets@a53fc80bc30b0a16a262520465db899fa3af08b7 # get-vault-secrets/v1.3.2
        with:
          # Keep it on the step output rather than exporting it into the
          # environment of every later step, claude-code-action included.
          export_env: false
          repo_secrets: |
            ANTHROPIC_API_KEY=anthropic:api-key

      - name: Ask Claude
        id: claude
        if: steps.gate.outputs.ready == 'true'
        uses: anthropics/claude-code-action@ef8bb1e43bf303cff727a1dd0b8837029fe982a2 # v1.0.215
        with:
          anthropic_api_key: ${{ fromJSON(steps.secrets.outputs.secrets).ANTHROPIC_API_KEY }}
          # The read-only workflow token. Claude reads untrusted input, so it
          # must never hold something that can write.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model "${{ env.CLAUDE_MODEL }}"
            --effort "${{ env.CLAUDE_EFFORT }}"
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Edit(pr-impact-tier.txt),Edit(pr-impact-spots.tsv),Edit(pr-impact-summary.md)"

      # Claude is only allowed to write pr-impact-report.txt, but the next step
      # runs code out of this checkout, so put the tracked files back rather
      # than lean on that one permission rule holding.
      - name: Put the checkout back
        if: steps.gate.outputs.ready == 'true'
        run: git checkout -- .

      - name: Read the rating
        id: parse
        if: steps.gate.outputs.ready == 'true'
        run: node .mise/tasks/pr-impact/parse.mjs
        env:
          TIER_FILE: pr-impact-tier.txt
          SPOTS_FILE: pr-impact-spots.tsv
          SUMMARY_FILE: pr-impact-summary.md
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          # Only used if the transcript does not name the model itself.
          CLAUDE_MODEL: ${{ env.CLAUDE_MODEL }}

  post:
    name: Post rating
    needs: judge
    # `needs: judge` already requires it to have succeeded; this is the base-branch guard.
    if: needs.judge.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      # Creating a label (as opposed to putting one on a PR) counts as an issues
      # write.
      issues: write
    steps:
      # This job reads the tasks and nothing else, so don't pay for the rest of
      # the repository.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .mise/tasks/pr-impact

      - run: node .mise/tasks/pr-impact/post.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FLOOR: ${{ needs.judge.outputs.floor }}
          FLOOR_REASON: ${{ needs.judge.outputs.reason }}
          CLAUDE_TIER: ${{ needs.judge.outputs.tier }}
          CLAUDE_BODY: ${{ needs.judge.outputs.body }}
          SPOTS: ${{ needs.judge.outputs.spots }}
          MODEL: ${{ needs.judge.outputs.model }}
          EFFORT: ${{ env.CLAUDE_EFFORT }}
          TOOK: ${{ needs.judge.outputs.took }}
          TRUNCATED: ${{ needs.judge.outputs.truncated }}
