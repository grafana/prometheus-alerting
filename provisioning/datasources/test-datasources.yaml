apiVersion: 1

datasources:
  # Main test Prometheus instance - vanilla Prometheus (no Ruler API)
  - name: Test Prometheus
    type: prometheus
    uid: test-prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      # Configure as alerting data source
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      implementation: prometheus
    version: 1

  # Alertmanager data source
  - name: Test Alertmanager
    type: alertmanager
    uid: test-alertmanager
    url: http://alertmanager:9093
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      implementation: prometheus
    version: 1

  # Mimir with Ruler API - for testing rule creation/editing
  - name: Test Mimir
    type: prometheus
    uid: test-mimir
    url: http://mimir:9009/prometheus
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      manageAlerts: true
      prometheusType: Mimir
      prometheusVersion: 2.40.0
      implementation: mimir
      httpHeaderName1: X-Scope-OrgID
      httpMethod: POST
      customQueryParameters: ''
      disableRecordingRules: false
    secureJsonData:
      httpHeaderValue1: anonymous
    version: 1

  # Loki with Ruler API - for testing Loki rule creation/editing
  - name: Test Loki
    type: loki
    uid: test-loki
    url: http://loki:3100
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      manageAlerts: true
      maxLines: 1000
    version: 1

  # Mimir Alertmanager - for testing Alertmanager configuration CRUD
  # The tenant's config is seeded by the mimir-alertmanager-provisioner container
  # (see test-data/mimir/provision-alertmanager.mjs).
  - name: Test Mimir Alertmanager
    type: alertmanager
    uid: test-mimir-alertmanager
    url: http://mimir:9009
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      implementation: mimir
      handleGrafanaManagedAlerts: false
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: anonymous
    version: 1

  # INTENTIONALLY BROKEN – do not "fix" this one.
  # It points at a host that can never exist (`.invalid` is a reserved TLD, so the DNS lookup
  # fails straight away), which makes every request to it fail. We use it to check that the rule
  # list hides data sources that can't serve their rules instead of breaking the whole page.
  - name: '[Broken] Test Prometheus (intentionally unreachable)'
    type: prometheus
    uid: test-broken-prometheus
    url: http://intentionally-broken-datasource.invalid:9090
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      implementation: prometheus
    version: 1
