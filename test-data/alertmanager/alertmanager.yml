route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    # Critical alerts go to both pagerduty and slack (continue: true sends to both)
    - receiver: pagerduty
      matchers:
        - severity = critical
      continue: true

    - receiver: slack-critical
      matchers:
        - severity = critical

    # Platform team alerts go to both slack-platform and email
    - receiver: slack-platform
      matchers:
        - team = platform
      continue: true

    - receiver: email-platform
      matchers:
        - team = platform

    # Mixed receiver for alerts that need multiple notification channels
    - receiver: mixed
      matchers:
        - team = ops

inhibit_rules:
  # Suppress warning alerts when a critical alert is already firing for the same alertname and instance
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal:
      - alertname
      - instance

  # Suppress all platform-team alerts when a critical infrastructure alert is firing on the same cluster
  - source_matchers:
      - alertname = ClusterDown
      - severity = critical
    target_matchers:
      - team = platform
    equal:
      - cluster

  # Suppress ops-team non-critical alerts when a critical ops alert is already firing
  - source_matchers:
      - team = ops
      - severity = critical
    target_matchers:
      - team = ops
      - severity =~ "warning|info"
    equal:
      - namespace

receivers:
  - name: default
    webhook_configs:
      - url: 'http://localhost:9999/webhook'
        send_resolved: true

  - name: pagerduty
    pagerduty_configs:
      - routing_key: 'dummy-routing-key-pagerduty'
        severity: 'critical'
        client: 'Alertmanager'
        client_url: 'https://grafana.example.com'
        description: '{{ .CommonLabels.alertname }}'
        send_resolved: true

  - name: slack-critical
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/DUMMY/DUMMY/DUMMYTOKEN'
        channel: '#critical-alerts'
        username: 'Alertmanager'
        title: '{{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true

  - name: slack-platform
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/DUMMY/DUMMY/DUMMYTOKEN2'
        channel: '#platform-alerts'
        username: 'Alertmanager'
        title: '{{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true

  - name: email-platform
    email_configs:
      - to: 'platform-team@example.com'
        from: 'alertmanager@example.com'
        smarthost: 'smtp.example.com:587'
        auth_username: 'alertmanager@example.com'
        auth_password: 'dummy-smtp-password'
        require_tls: true
        send_resolved: true

  - name: mixed
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/DUMMY/DUMMY/DUMMYTOKEN3'
        channel: '#ops-alerts'
        username: 'Alertmanager'
        title: '{{ .CommonLabels.alertname }}'
        send_resolved: true
    pagerduty_configs:
      - routing_key: 'dummy-routing-key-ops'
        severity: 'warning'
        client: 'Alertmanager'
        send_resolved: true
    email_configs:
      - to: 'ops-team@example.com'
        from: 'alertmanager@example.com'
        smarthost: 'smtp.example.com:587'
        send_resolved: true
