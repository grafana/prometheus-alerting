name: e2e-test-group
interval: 1m
rules:
  - alert: TestEditRule
    expr: up == 0
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: Original summary for testing edit
      description: This rule is used for testing the edit functionality

  - alert: TestCloneRule
    expr: vector(1) > 0
    for: 2m
    labels:
      severity: info
    annotations:
      summary: Rule to be cloned

  - record: test:recording:rule
    expr: sum(up)
    labels:
      environment: test
