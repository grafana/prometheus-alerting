multitenancy_enabled: true

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: info

blocks_storage:
  backend: s3
  s3:
    endpoint: minio:9000
    bucket_name: mimir-blocks
    access_key_id: mimir
    secret_access_key: mimirmimir
    insecure: true

ruler_storage:
  backend: s3
  s3:
    endpoint: minio:9000
    bucket_name: mimir-ruler
    access_key_id: mimir
    secret_access_key: mimirmimir
    insecure: true

alertmanager_storage:
  backend: s3
  s3:
    endpoint: minio:9000
    bucket_name: mimir-alertmanager
    access_key_id: mimir
    secret_access_key: mimirmimir
    insecure: true

alertmanager:
  enable_api: true
  external_url: http://localhost:9009/alertmanager

ruler:
  enable_api: true
  rule_path: /data/rules-tmp
  # Let a rule group name other tenants in "source_tenants". Without this Mimir
  # rejects such a group with a 400, so the E2E test that seeds a federated group
  # cannot even set it up. Needs "tenant_federation" below turned on as well.
  tenant_federation:
    enabled: true
  alertmanager_url: http://mimir:9009/alertmanager
  # Speed up rule propagation for E2E tests. By default a rule created via the
  # config API is re-synced through a queue that is only polled every 10s
  # (inbound + outbound), so a newly created rule takes ~10s to appear in the
  # rules API. Lowering the queue poll intervals makes propagation near-instant.
  outbound_sync_queue_poll_interval: 1s
  inbound_sync_queue_poll_interval: 1s

limits:
  max_global_series_per_user: 100000
  ruler_max_rules_per_rule_group: 100
  ruler_max_rule_groups_per_tenant: 100

# Single-instance mode ring configuration
ingester:
  ring:
    replication_factor: 1

store_gateway:
  sharding_ring:
    replication_factor: 1

compactor:
  sharding_ring:
    wait_stability_min_duration: 0s

# Use memberlist for ring coordination
memberlist:
  join_members:
    - mimir-test:7946

# Required alongside "ruler.tenant_federation" above -- Mimir refuses to start if
# the ruler is allowed to federate but this is off.
tenant_federation:
  enabled: true
