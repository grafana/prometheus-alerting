[settings]
minimum_release_age = "3d" # only install versions released more than 3 days ago

lockfile = true
not_found_auto_install = false

# Shared tools for both CI and local development
# Dev-only tools (lefthook, trufflehog) are in mise.development.toml, loaded via .miserc.toml
[tools]
node = "24.18.0"
pnpm = "11.17.0"

# Documentation preview. Both tasks need Docker or Podman running.
#
# `docs` mounts docs/sources where the website puts it — under a version
# directory, so cross-page links that use /latest/ resolve here as they do on
# grafana.com — and then does two things the image needs:
#
#   - Write a section page for `plugins/`. The image ships content for every
#     other Grafana product but no `plugins` section, and without one the
#     sidebar falls back to walking the whole bundled tree and lists them all.
#     The plugin level below it is left to Hugo: giving it a page of its own
#     puts a second, redundant node in the sidebar.
#   - Run the image's own `make server-docs` rather than `hugo server`. That
#     target passes --environment=docs and starts the website-proxy on 3002 in
#     front of hugo on 3003. Both ports are published; you browse 3002.

[tasks.docs]
description = "Serve the docs at http://localhost:3002/docs/plugins/grafana-prometheusalerting-app/latest/"
run = """
set -eu
name=prometheus-alerting-docs

# The container is started detached and followed with `docker logs`, rather than
# run in the foreground. Ctrl+C doesn't reliably stop a foreground `docker run`
# here: the container's entry point is `make`, and the interrupt isn't passed on
# to the hugo and proxy processes it spawns, so the container keeps running and
# holds ports 3002 and 3003. Following the logs instead means Ctrl+C stops the
# client, and the trap removes the container.
cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
trap cleanup EXIT INT TERM
cleanup

docker run --detach --init --name "$name" \
  --publish 3002:3002 --publish 3003:3003 \
  --volume "$MISE_PROJECT_ROOT/docs/sources:/hugo/content/docs/plugins/grafana-prometheusalerting-app/latest:ro" \
  grafana/docs-base:latest \
  sh -c 'printf -- "---\ntitle: Plugins\n---\n" > /hugo/content/docs/plugins/_index.md && exec make server-docs' >/dev/null

echo "Building. The site takes a little while to answer on first run."
echo "Then browse http://localhost:3002/docs/plugins/grafana-prometheusalerting-app/latest/"
echo "Press Ctrl+C to stop."
docker logs --follow "$name"
"""

[tasks."docs:lint"]
description = "Lint the docs prose against Grafana's style guide"
run = """
set -eu
cd "$MISE_PROJECT_ROOT"
docker run --rm --init --workdir /w \
  --volume "$PWD/docs/sources:/w/docs/sources:ro" \
  grafana/vale:latest \
  --config=/etc/vale/.vale.ini \
  --minAlertLevel="${VALE_MINALERTLEVEL:-error}" \
  --glob='*.md' \
  docs/sources
"""
