[settings]
minimum_release_age = "3d" # only install versions released more than 3 days ago

lockfile = true
not_found_auto_install = false

# Shared tools for both CI and local development
# Dev-only tools (lefthook, trufflehog) are in mise.development.toml, loaded via .miserc.toml
[tools]
node = "26.5.0"
pnpm = "11.15.1"
