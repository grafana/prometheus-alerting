services:
  grafana:
    user: root
    container_name: 'grafana-prometheusalerting-app'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana}
        grafana_version: ${GRAFANA_VERSION:-12.3.0}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 3000:3000/tcp
    volumes:
      - ../dist:/var/lib/grafana/plugins/grafana-prometheusalerting-app
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/grafana-prometheusalerting-app

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.grafana-prometheusalerting-app:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-prometheusalerting-app
      GF_USERS_DEFAULT_PERMISSIONS: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: false
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: promRulerApiViaProxyWrite
