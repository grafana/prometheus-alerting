# Vanilla Alertmanager, used as the "Test Alertmanager" data source.
services:
  alertmanager:
    image: prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
    container_name: alertmanager-test
    ports:
      - '9093:9093'
    volumes:
      - ../../test-data/alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address='
