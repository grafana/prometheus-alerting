# Object storage for Mimir and Loki. minio-init creates the buckets they expect.
#
# MinIO stopped publishing images (minio/minio and minio/mc are gone from Docker Hub), so we use
# Silo, pgsty's community fork of the same source. It keeps the MinIO command line, MINIO_* env vars
# and the bundled mc, so only the images changed. See https://silo.pgsty.com/compatibility/migration/
services:
  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    container_name: minio-test
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: mimir
      MINIO_ROOT_PASSWORD: mimirmimir
    command: server /data --console-address ":9001"
    volumes:
      - type: tmpfs
        target: /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z@sha256:6ecdaec70bc5e8cf9d0e9a70c190f3beb1c83f11617ff4333f1fcd71ab1daf18
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 mimir mimirmimir;
      mc mb myminio/mimir-ruler --ignore-existing;
      mc mb myminio/mimir-blocks --ignore-existing;
      mc mb myminio/mimir-alertmanager --ignore-existing;
      mc mb myminio/loki-chunks --ignore-existing;
      mc mb myminio/loki-ruler --ignore-existing;
      exit 0;
      "
