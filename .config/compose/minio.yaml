# Object storage for Mimir and Loki. minio-init creates the buckets they expect.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio-test
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: mimir
      MINIO_ROOT_PASSWORD: mimirmimir
    command: server /data --console-address ":9001"
    volumes:
      - type: tmpfs
        target: /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 mimir mimirmimir;
      mc mb myminio/mimir-ruler --ignore-existing;
      mc mb myminio/mimir-blocks --ignore-existing;
      mc mb myminio/mimir-alertmanager --ignore-existing;
      mc mb myminio/loki-chunks --ignore-existing;
      mc mb myminio/loki-ruler --ignore-existing;
      exit 0;
      "
