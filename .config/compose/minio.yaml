# Object storage for Mimir and Loki. minio-init creates the buckets they expect.
# MinIO stopped publishing images (minio/minio and minio/mc are gone from Docker Hub),
# so these come from pgsty, a community build of the same source with the same layout.
services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: minio-test
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: mimir
      MINIO_ROOT_PASSWORD: mimirmimir
    command: server /data --console-address ":9001"
    volumes:
      - type: tmpfs
        target: /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 mimir mimirmimir;
      mc mb myminio/mimir-ruler --ignore-existing;
      mc mb myminio/mimir-blocks --ignore-existing;
      mc mb myminio/mimir-alertmanager --ignore-existing;
      mc mb myminio/loki-chunks --ignore-existing;
      mc mb myminio/loki-ruler --ignore-existing;
      exit 0;
      "
