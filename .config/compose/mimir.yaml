# Mimir (rules and Alertmanager), plus the two containers that load test data into it on startup.
# Needs the services from minio.yaml.
services:
  mimir:
    image: grafana/mimir:3.2.2@sha256:04068a0a838b6efe9449a04c1d6acd74c7438ac6073dfcbb99c29892647525e3
    container_name: mimir-test
    ports:
      - '9009:9009'
    volumes:
      - ../../test-data/mimir:/etc/mimir:ro
      - type: tmpfs
        target: /data
    command:
      - '-config.file=/etc/mimir/mimir.yaml'
      - '-target=all,alertmanager'
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  mimir-rules-provisioner:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    container_name: mimir-rules-provisioner
    depends_on:
      - mimir
    volumes:
      - ../../test-data/mimir/rules:/rules:ro
      - ../../test-data/mimir/provision-rules.mjs:/provision-rules.mjs:ro
    restart: on-failure
    command: ['node', '/provision-rules.mjs']

  mimir-alertmanager-provisioner:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    container_name: mimir-alertmanager-provisioner
    depends_on:
      - mimir
    volumes:
      - ../../test-data/mimir/alertmanager:/alertmanager:ro
      - ../../test-data/mimir/provision-alertmanager.mjs:/provision-alertmanager.mjs:ro
    restart: on-failure
    command: ['node', '/provision-alertmanager.mjs']
