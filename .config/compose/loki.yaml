# Loki, plus the container that loads its test rules on startup. Needs the services from minio.yaml.
services:
  loki:
    image: grafana/loki:3.2.0
    container_name: loki-test
    ports:
      - '3100:3100'
    volumes:
      - ../../test-data/loki:/etc/loki:ro
    command:
      - '-config.file=/etc/loki/loki.yaml'
      - '-target=all'
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  loki-rules-provisioner:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    container_name: loki-rules-provisioner
    depends_on:
      - loki
    volumes:
      - ../../test-data/loki/rules:/rules:ro
      - ../../test-data/loki/provision-rules.mjs:/provision-rules.mjs:ro
    restart: on-failure
    command: ['node', '/provision-rules.mjs']
