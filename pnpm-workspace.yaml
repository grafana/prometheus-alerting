# Security Settings
blockExoticSubdeps: true # blocks git repositories etc. as dependencies
strictDepBuilds: true # disable unverified post-install scripts
dangerouslyAllowAllBuilds: false
verifyDepsBeforeRun: install
# 3 days, in minutes. This applies to @grafana/* packages too, the same as Renovate's gate. When
# Renovate opens a security update for a version newer than that, it adds that version to
# minimumReleaseAgeExclude itself. Delete the entry once the version is older than 3 days.
minimumReleaseAge: 4320

# Security overrides only stay while something still asks for a vulnerable version. To check
# whether one is still needed, delete it, resolve from scratch (`pnpm install --lockfile-only`
# without a lockfile) and run `pnpm audit`.
overrides:
  # i18next 25.x prints a console ad for its paid Locize product on every init (which
  # @grafana/i18n triggers lazily and without opting out) - 26.x dropped the ad entirely.
  'i18next': '^26.0.0'
  # Transitive-only advisory, reached through test tooling. faker never patched the 9.x line, so
  # this crosses a major. @grafana/alerting only pulls faker in for its mock factories, and those
  # stick to APIs that 10.x kept (helpers.arrayElement, number.int, string.alphanumeric and
  # friends) - not helpers.fake, which is the one the advisory is about.
  '@faker-js/faker': '^10.5.0'
  # @grafana/data pins moment to exactly 2.30.1.
  moment@>=2.29.2 <2.31.0: ^2.31.0
  # Crosses a major, reached only through @grafana/sign-plugin > proxy-agent > get-uri, which still
  # asks for ^5. 6.0.0 only changed one default: the server can no longer send a transfer to a
  # different host unless the client allows it, and get-uri never needs that.
  basic-ftp@<6.2.1: ^6.2.1

auditConfig:
  ignoreGhsas:
    # braces through 3.0.3 can overflow the stack on a deeply nested pattern, and no fixed version
    # exists yet. It only arrives through micromatch in build and test tooling, which only ever
    # expands patterns from this repo's own config, and none of it ends up in the plugin bundle.
    # Remove this once braces publishes a fix and add an override instead.
    - GHSA-vfj7-8cjw-p6xm
    # react-router only fixed these in 7.18.0, and Grafana (react-router-dom-v5-compat) and this
    # plugin are both on 6.x, so an override would cross a major under Grafana's feet. react-router
    # itself is in the bundler externals, so the copy that runs is the one Grafana ships. The open
    # redirect also needs an attacker-supplied path passed to <Link> or navigate(), and this plugin
    # builds those from its own route constants. The second one only affects server-side
    # rendering, which a Grafana plugin never does. Remove these once Grafana and this plugin move
    # to react-router 7.
    - GHSA-wrjc-x8rr-h8h6 # open redirect via a backslash in <Link> and useNavigate
    - GHSA-337j-9hxr-rhxg # constructor injection in deserializeErrors() during SSR hydration

packages:
  - 'packages/*'

allowBuilds:
  '@swc/core': true
  core-js: false
  esbuild: true
  msw: true
