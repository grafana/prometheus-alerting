# Security Settings
blockExoticSubdeps: true # blocks git repositories etc. as dependencies
strictDepBuilds: true # disable unverified post-install scripts
dangerouslyAllowAllBuilds: false
verifyDepsBeforeRun: install
minimumReleaseAge: 10080 # 7 days, in minutes
minimumReleaseAgeExclude:
  - '@grafana/*'

overrides:
  'immutable@5.1': '>=5.1.5'
  'react-data-grid': '>=7.0.0-beta.57'
  'js-cookie': '>=3.0.6'
  'dompurify': '>=3.3.2'
  'uuid': '>=11.1.1'
  '@types/react': '18.3.29'
  '@types/react-dom': '18.3.7'

registries:
  '@jsr': https://npm.jsr.io

packages:
  - 'packages/*'

allowBuilds:
  '@swc/core': true
  core-js: true
  esbuild: true
  msw: true
  protobufjs: false
